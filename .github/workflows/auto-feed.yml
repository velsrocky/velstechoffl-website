name: Auto-generate feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate feed.xml from articles.js
        run: node tools/gen-feed.js

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet feed.xml; then
            echo "No changes to feed.xml"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "feed.xml needs updating"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "chore: regenerate feed.xml"
          git push
