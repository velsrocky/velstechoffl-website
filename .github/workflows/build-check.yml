name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check tools
        run: node --check tools/*.js
      - name: Verify boilerplate + asset versions
        run: node tools/build.js check
