name: Post new articles to socials

on:
  push:
    branches: [main]
    paths:
      - "articles.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect and post new articles
        run: node tools/post-new-articles.js
        env:
          # X / Twitter (API v2, OAuth 2.0 Bearer token) – set in repo Settings → Secrets and variables → Actions
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          # Mastodon
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          # Generic webhook (n8n / Zapier / Buffer / Make)
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
