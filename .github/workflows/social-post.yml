name: Post new articles to socials

on:
  push:
    branches: [main]
    paths:
      - "articles.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect and post new articles
        run: node tools/post-new-articles.js
        env:
          # X / Twitter (API v2, OAuth 2.0 Bearer token) – set in repo Settings → Secrets and variables → Actions
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          # Mastodon
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          # Bluesky (handle + app password from Settings → App Passwords)
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Generic webhook (n8n / Zapier / Buffer / Make)
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Commit posted-state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet tools/posted-articles.json; then
            git add tools/posted-articles.json
            git commit -m "chore: mark posted articles"
            git push
          fi
