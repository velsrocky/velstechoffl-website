<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="robots" content="noindex" />
  <title>Offline | VelsTech</title>
  <link rel="icon" href="logo.svg" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0b0f14; color: #e6edf3; font-family: "Inter Variable", system-ui, sans-serif; }
    .box { text-align: center; padding: 2rem; max-width: 34rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
    h1 span { color: #4cc2ff; }
    p { color: #9aa8b8; line-height: 1.6; margin: .5rem 0; }
    a { color: #4cc2ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .tip { font-size: .9rem; margin-top: 1.25rem; color: #6b7280; }
  </style>
</head>
<body>
  <main class="box">
    <h1>You're <span>offline</span></h1>
    <p>This page hasn't been cached yet – but everything you've visited before still works.</p>
    <p><a href="/">Try the homepage →</a></p>
    <p class="tip">Tools like Notes, Bookmarks and the calculators work fully offline once loaded.</p>
  </main>
</body>
</html>
